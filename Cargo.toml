[package]
name = "beg"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Run English scripts as Unix processes"

[dependencies]
base64 = "0.22"
codex-app-server-client = { git = "https://github.com/openai/codex", rev = "581161ab41e643d942e1e1b5f561034060bf18e3" }
codex-app-server-protocol = { git = "https://github.com/openai/codex", rev = "581161ab41e643d942e1e1b5f561034060bf18e3" }
codex-arg0 = { git = "https://github.com/openai/codex", rev = "581161ab41e643d942e1e1b5f561034060bf18e3" }
codex-code-mode = { git = "https://github.com/openai/codex", rev = "581161ab41e643d942e1e1b5f561034060bf18e3" }
codex-config = { git = "https://github.com/openai/codex", rev = "581161ab41e643d942e1e1b5f561034060bf18e3" }
codex-core = { git = "https://github.com/openai/codex", rev = "581161ab41e643d942e1e1b5f561034060bf18e3" }
codex-feedback = { git = "https://github.com/openai/codex", rev = "581161ab41e643d942e1e1b5f561034060bf18e3" }
codex-protocol = { git = "https://github.com/openai/codex", rev = "581161ab41e643d942e1e1b5f561034060bf18e3" }
codex-utils-absolute-path = { git = "https://github.com/openai/codex", rev = "581161ab41e643d942e1e1b5f561034060bf18e3" }
dirs = "6"
humantime = "2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
toml = "0.9.5"

[target.'cfg(target_os = "linux")'.dependencies]
codex-utils-pty = { git = "https://github.com/openai/codex", rev = "581161ab41e643d942e1e1b5f561034060bf18e3" }

# Cargo only applies patches from the root manifest. Keep these in sync with
# the pinned Codex workspace.
[patch.crates-io]
sqlx-core = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-sqlite = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "7447c427513cfe685f236e1ac0513c4ea3dd9c0b" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "bc589d684755a8c02da0fc7e58d0861cbfc306f1" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "bc589d684755a8c02da0fc7e58d0861cbfc306f1" }

[package.metadata.beg]
codex-version = "0.171.0-alpha.13"
codex-revision = "581161ab41e643d942e1e1b5f561034060bf18e3"
